[project]
name = "telegram-ai-lab1"
version = "1.0.0"
description = "AI-помощник студента: режимы, постоянная история и эксперимент"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests requiring Docker and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-backup-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
